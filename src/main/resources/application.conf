app {
  flights-dir            = "data/Flights"
  weather-dir            = "data/Weather"
  airport-csv            = "data/wban_airport_timezone.csv"
  out-root               = "out"
  window-hours           = 12
  lags                   = 7
  delay-threshold-minutes = 60

  # Dataset de retards ciblé (section 4.2 de l’article, jeux D1–D4). :contentReference[oaicite:0]{index=0}
  delay-dataset          = "D2"

  # Jeu de features :
  #   - "with-weather" : vol + lags météo Wo/Wd
  #   - "no-weather"   : vol seul (baseline sans météo, cf. section 4 de l’article).
  feature-set            = "with-weather"
}
